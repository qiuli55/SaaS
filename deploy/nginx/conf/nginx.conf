worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;

    # ============== 80：主入口（IP / 域名都能访问） ==============
    server {
        listen      80;
        listen      [::]:80;
        server_name qiuli55.top www.qiuli55.top _;

        # SPA 静态文件根目录
        root  "C:\SaaS\frontend\dist";
        # 注意：上面 root 路径是服务器上 nginx 部署的绝对路径
        # 如果你的服务器项目路径不是 C:\SaaS\，把这里改成对应绝对路径
        # 路径写法两选一：
        #   ① Windows 反斜杠 + 双引号：C:\SaaS\frontend\dist
        #   ② nginx 正斜杠（推荐）：C:/SaaS/frontend/dist
        # 用法推荐改为：root  C:/SaaS/frontend/dist;

        index index.html;

        # gzip 压缩
        gzip on;
        gzip_min_length 1k;
        gzip_types text/plain text/css text/javascript application/javascript
                   application/json application/xml image/svg+xml;
        gzip_vary on;

        # 前端 SPA 路由 history fallback：任何路径找不到都返回 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源缓存（带 hash 名的 JS/CSS）
        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }

        # 后端 API 反代到 uvicorn 8001
        location /api/ {
            proxy_pass         http://127.0.0.1:8001/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # AI 接口响应慢，放宽到 240s
            proxy_read_timeout  240s;
            proxy_send_timeout  240s;
            proxy_connect_timeout 60s;
        }

        # 上传文件目录直接 serve（合同/文书附件）
        location /uploads/ {
            alias C:/SaaS/backend/uploads/;
            autoindex off;
        }

        # 健康检查
        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # ============== 443：HTTPS（等正式 SSL 证书后再启用） ==============
    # 当前自签名证书浏览器会拒访，先注释掉，等申请到正式证书（见 SSL-SETUP.md）再打开
    #
    # server {
    #     listen      443 ssl;
    #     listen      [::]:443 ssl;
    #     server_name qiuli55.top www.qiuli55.top;
    #
    #     ssl_certificate     C:/SaaS/nginx/conf/ssl/qiuli55.top.crt;
    #     ssl_certificate_key C:/SaaS/nginx/conf/ssl/qiuli55.top.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     root  C:/SaaS/frontend/dist;
    #     index index.html;
    #
    #     location / {
    #         try_files $uri $uri/ /index.html;
    #     }
    #
    #     location /api/ {
    #         proxy_pass         http://127.0.0.1:8001/api/;
    #         proxy_http_version 1.1;
    #         proxy_set_header   Host              $host;
